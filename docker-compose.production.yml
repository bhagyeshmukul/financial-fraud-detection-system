# Private server stack: database health gates migrations, which gate API startup.
services:
  # Initialize an empty volume; retain existing records on later starts.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Apply pending table revisions before any API worker handles requests.
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fraud_db}}
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  # Workers share PostgreSQL and completed, read-only model/report bundles.
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-fraud_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fraud_db}}
      APP_ENV: production
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN}
      CORS_ORIGINS: ""
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes: ["./backend/models/v2:/app/models/v2:ro", "./backend/reports/v2:/app/reports/v2:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
  # Host HTTPS proxy forwards to this loopback-only private gateway.
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      ANALYST_USER: ${ANALYST_USER:?Set ANALYST_USER}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN}
      NGINX_ENVSUBST_FILTER: "API_ACCESS_TOKEN"
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      backend: {condition: service_healthy}
# Durable database state; this volume is not a disposable build cache.
volumes:
  postgres_data:
