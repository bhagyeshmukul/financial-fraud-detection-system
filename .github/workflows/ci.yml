# GitHub checks for code, migrations, proxy boundaries and container builds.
name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fraud_test
          POSTGRES_USER: fraud_test
          POSTGRES_PASSWORD: fraud_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U fraud_test" --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      DATABASE_URL: postgresql+psycopg2://fraud_test:fraud_test@localhost:5432/fraud_test
      TEST_DATABASE_URL: postgresql+psycopg2://fraud_test:fraud_test@localhost:5432/fraud_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head && pytest -q
        working-directory: backend
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker build -t fraud-api ./backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: node --test deploy/sites/worker.test.mjs
      - run: docker build -t fraud-web ./frontend
